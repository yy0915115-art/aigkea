<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram 模擬頁面</title>
  <!-- 引入 Tailwind CSS 快速樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 flex justify-center items-center min-h-screen text-gray-900 font-sans">

  <!-- IG 手機外框容器 -->
  <div class="max-w-md w-full bg-white border border-gray-200 min-h-screen sm:min-h-0 sm:rounded-2xl sm:shadow-xl overflow-hidden pb-14">
    
    <!-- 1. 頂部導覽列 Header -->
    <header class="sticky top-0 bg-white/95 backdrop-blur-md z-10 flex justify-between items-center px-4 py-3 border-b border-gray-100">
      <span class="font-bold text-xl italic tracking-tight font-serif">Instagram</span>
      <div class="flex items-center space-x-5">
        <i data-lucide="heart" class="w-6 h-6 cursor-pointer hover:opacity-70 transition"></i>
        <i data-lucide="message-circle" class="w-6 h-6 cursor-pointer hover:opacity-70 transition"></i>
      </div>
    </header>

    <!-- 2. 限時動態區 (Stories) -->
    <section class="flex space-x-4 p-3 overflow-x-auto border-b border-gray-100 no-scrollbar">
      <!-- 個人限時動態 -->
      <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
        <div class="relative w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-full h-full rounded-full object-cover border-2 border-white">
        </div>
        <span class="text-xs text-gray-600 max-w-[64px] truncate">your_story</span>
      </div>
      <!-- 品牌/好友限動 1 -->
      <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
        <div class="relative w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600">
          <div class="w-full h-full rounded-full bg-yellow-400 border-2 border-white flex items-center justify-center font-bold text-blue-700 text-xs">
            IKEA
          </div>
        </div>
        <span class="text-xs text-gray-600 max-w-[64px] truncate">ikea_taiwn</span>
      </div>
    </section>

    <!-- 3. 貼文主要內容區 -->
    <article class="border-b border-gray-100">
      
      <!-- 發文者標頭 -->
      <div class="flex items-center justify-between p-3">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-full bg-yellow-400 border border-blue-600 flex items-center justify-center font-bold text-blue-700 text-xs">
            IKEA
          </div>
          <div>
            <div class="flex items-center space-x-1">
              <span class="font-semibold text-sm">ikea_taiwn</span>
              <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-500 fill-blue-500 text-white"></i>
            </div>
            <span class="text-xs text-gray-500">台灣 · 贊助內容</span>
          </div>
        </div>
        <i data-lucide="more-horizontal" class="w-5 h-5 text-gray-600 cursor-pointer"></i>
      </div>

      <!-- 貼文大圖 -->
      <div class="w-full bg-gray-100 aspect-square">
        <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80" alt="IKEA 居家" class="w-full h-full object-cover">
      </div>

      <!-- 互動按鈕列 -->
      <div class="p-3 pb-1">
        <div class="flex justify-between items-center mb-2">
          <div class="flex items-center space-x-4">
            <i data-lucide="heart" id="like-btn" class="w-6 h-6 cursor-pointer hover:text-red-500 transition"></i>
            <i data-lucide="message-circle" class="w-6 h-6 cursor-pointer hover:opacity-70 transition"></i>
            <i data-lucide="send" class="w-6 h-6 cursor-pointer hover:opacity-70 transition"></i>
          </div>
          <i data-lucide="bookmark" class="w-6 h-6 cursor-pointer hover:opacity-70 transition"></i>
        </div>
        <p class="font-semibold text-sm mb-1"><span id="like-count">1,248</span> 次按讚</p>
      </div>

      <!-- 貼文文案 -->
      <div class="px-3 text-sm text-gray-800 leading-relaxed whitespace-pre-line">
        <span class="font-semibold mr-2">ikea_taiwn</span>新年到了，是時候為家裡換上新的生活風格！

✨ 簡約北歐設計 
✨ 實用居家用品 
✨ 舒適生活空間 

📅活動期間：即日起至10/31
數量有限，要買要快！！

<span class="text-blue-900 font-normal">#IKEA #過年出清 #簡約生活 #居家生活</span>
      </div>

      <!-- 發布時間 -->
      <div class="px-3 my-2">
        <span class="text-[10px] text-gray-400 uppercase">2 天前</span>
      </div>

      <!-- 4. 留言問答區 -->
      <div class="border-t border-gray-100 p-3 bg-gray-50 space-y-3">
        <p class="text-xs font-semibold text-gray-500 mb-1">熱門留言</p>

        <!-- 顧客留言 -->
        <div class="flex items-start space-x-2 text-sm">
          <div class="w-7 h-7 rounded-full bg-gray-300 flex-shrink-0 flex items-center justify-center text-xs font-bold text-gray-600">
            C
          </div>
          <div class="bg-white p-2.5 rounded-2xl border border-gray-200 flex-1">
            <span class="font-semibold text-xs block text-gray-900">👤 顧客</span>
            <p class="text-gray-700 text-xs mt-0.5">小編～想問一下，這次過年出清是到幾號呀？我想週末再過去逛逛～</p>
          </div>
        </div>

        <!-- 小編回覆 -->
        <div class="flex items-start space-x-2 text-sm pl-6">
          <div class="w-7 h-7 rounded-full bg-yellow-400 border border-blue-600 flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-blue-700">
            IKEA
          </div>
          <div class="bg-blue-50/80 p-2.5 rounded-2xl border border-blue-100 flex-1">
            <div class="flex items-center space-x-1">
              <span class="font-semibold text-xs text-gray-900">💙💛 IKEA 小編</span>
              <i data-lucide="check-circle-2" class="w-3 h-3 text-blue-500 fill-blue-500 text-white"></i>
            </div>
            <p class="text-gray-700 text-xs mt-0.5">嗨～這次過年出清活動會到 2/15 喔！✨</p>
          </div>
        </div>
      </div>

    </article>

    <!-- 5. 底部選單 Tab Bar -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-gray-200 flex justify-around items-center py-2 z-10">
      <i data-lucide="home" class="w-6 h-6 cursor-pointer"></i>
      <i data-lucide="compass" class="w-6 h-6 cursor-pointer text-gray-400"></i>
      <i data-lucide="plus-square" class="w-6 h-6 cursor-pointer text-gray-400"></i>
      <i data-lucide="film" class="w-6 h-6 cursor-pointer text-gray-400"></i>
      <div class="w-6 h-6 rounded-full overflow-hidden border border-gray-300 cursor-pointer">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover">
      </div>
    </nav>

  </div>

  <script>
    // 初始化 Lucide Icon 圖示
    lucide.createIcons();

    // 點擊愛心切換顏色簡單小互動
    const likeBtn = document.getElementById('like-btn');
    let isLiked = false;

    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;
      if (isLiked) {
        likeBtn.setAttribute('class', 'w-6 h-6 cursor-pointer text-red-500 fill-red-500 transition');
      } else {
        likeBtn.setAttribute('class', 'w-6 h-6 cursor-pointer hover:text-red-500 transition');
      }
      lucide.createIcons();
    });
  </script>
</body>
</html>
